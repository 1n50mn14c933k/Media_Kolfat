name: Bug report
description: Report a reproducible Media Kolfat problem
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a Media Kolfat problem. Remove personal data, private file paths, credentials and sensitive media before submitting.

  - type: input
    id: version
    attributes:
      label: Media Kolfat version
      placeholder: e.g. 1.0.0
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 24H2
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest reliable sequence that reproduces the problem.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true

  - type: checkboxes
    id: security
    attributes:
      label: Security confirmation
      options:
        - label: This report does not disclose a security vulnerability or sensitive information.
          required: true

name: Repository Hygiene Check

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Verify required public repository files exist
        shell: bash
        run: |
          set -euo pipefail
          test -f ".github/CODEOWNERS"
          test -f ".github/dependabot.yml"
          test -f "README.md"
          test -f "SECURITY.md"
          test -f "SUPPORT.md"
          test -f "ROADMAP.md"
          test -f "CONTRIBUTING.md"

      - name: Block sensitive or application-source material
        shell: bash
        run: |
          set -euo pipefail

          blocked_files='
          .env
          .env.local
          id_rsa
          id_ed25519
          passwords.txt
          secrets.yml
          secrets.yaml
          credentials.yml
          credentials.yaml
          *.pem
          *.key
          *.p12
          *.pfx
          *.sln
          *.csproj
          '

          for file in $blocked_files; do
            if find . -name "$file" -print -quit | grep -q .; then
              echo "Blocked private/source material found: $file"
              exit 1
            fi
          done

          echo "No blocked sensitive or application-source files found."
